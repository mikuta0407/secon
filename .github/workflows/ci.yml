name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Test
        # secon-gui は cgo と GUI ライブラリが必要なので build-gui-* ジョブで確認する
        run: go test $(go list ./... | grep -v /cmd/secon-gui)
      - name: Vet (CLI, linux / darwin)
        run: |
          go vet ./internal/... ./cmd/secon
          GOOS=darwin go vet ./internal/... ./cmd/secon

  build-gui-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build secon.app
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CGO_CFLAGS: -mmacosx-version-min=12.0
          CGO_LDFLAGS: -mmacosx-version-min=12.0
        run: |
          mkdir -p out
          CGO_ENABLED=0 go build -o out/secon ./cmd/secon
          go build -o out/secon-gui ./cmd/secon-gui
          packaging/macos/build-app.sh out/secon-gui out/secon 0.0.0-ci out
          otool -l out/secon.app/Contents/MacOS/secon-gui | grep -A3 LC_BUILD_VERSION | grep "minos 12.0"

  build-gui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - run: go build -o /dev/null ./cmd/secon-gui
